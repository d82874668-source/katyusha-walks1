name: Validate site
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done < <(find assets/js -type f -name '*.js' -print | sort)
      - name: Validate JSON data files
        run: |
          python -m json.tool manifest.webmanifest > /dev/null
          python -m json.tool tools/verified_places.json > /dev/null
      - name: Compile Python catalogue builder
        run: python -m py_compile tools/build_data.py
      - name: Rebuild and verify catalogue
        run: |
          python tools/build_data.py
          node --input-type=module -e '
            import fs from "node:fs";
            const source = fs.readFileSync("assets/js/data.js", "utf8");
            const { PLACES } = await import("data:text/javascript;charset=utf-8," + encodeURIComponent(source));
            const ids = PLACES.map((place) => String(place.id));
            if (new Set(ids).size !== ids.length) throw new Error("Duplicate place IDs");
            if (PLACES.length !== 133) throw new Error("Unexpected catalogue size: " + PLACES.length);
            for (let id = 990126; id <= 990143; id++) if (!ids.includes(String(id))) throw new Error("Missing added place ID " + id);
            for (let id = 990150; id <= 990173; id++) if (!ids.includes(String(id))) throw new Error("Missing verified place ID " + id);
            const added = PLACES.filter((place) => Number(place.id) >= 990150 && Number(place.id) <= 990173);
            if (added.length !== 24 || added.some((place) => !place.image || !place.address || place.is_approx || !Number.isFinite(Number(place.latitude)) || !Number.isFinite(Number(place.longitude)))) throw new Error("New catalogue records are incomplete or approximate");
            if (PLACES.some((place) => !place.image)) throw new Error("One or more place cards have no photo");
            if (!PLACES.some((place) => place.category === "mall")) throw new Error("Mall category missing");
            if (!PLACES.some((place) => place.category === "attraction")) throw new Error("Attraction category missing");
            if (PLACES.find((place) => String(place.id) === "64")?.is_approx !== false) throw new Error("Shirvanshah Palace coordinates are not verified");
            console.log("Catalogue OK:", PLACES.length, "places;", PLACES.filter((place) => place.category === "mall").length, "malls");
          '
      - name: Verify generated catalogue files are committed
        run: git diff --exit-code -- assets/js/data.js supabase/seed.sql
      - name: Run site QA audit
        run: python tools/qa_audit.py
      - name: Validate stylesheet structure
        run: |
          python - <<'PY'
          from pathlib import Path
          css = Path("assets/css/styles.css").read_text(encoding="utf-8")
          assert css.strip(), "Stylesheet is empty"
          assert css.count("{") == css.count("}"), "CSS braces are unbalanced"
          print(f"Stylesheet OK: {len(css)} characters")
          PY
